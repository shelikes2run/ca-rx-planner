name: Refresh PFIRS burns

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [scripts/pfirs_fetch.py, .github/workflows/pfirs.yml]

permissions:
  contents: write

concurrency:
  group: pfirs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch PFIRS (yesterday through next 7 days)
        run: python scripts/pfirs_fetch.py data/pfirs_burns.geojson --days-back 1 --days-ahead 7
      - name: Commit if changed
        run: |
          git add data/pfirs_burns.geojson
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "PFIRS burns refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
